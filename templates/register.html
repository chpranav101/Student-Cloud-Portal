<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration | Student Cloud Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #eef7ff, #f8fbff);
            min-height: 100vh;
        }

        .register-card {
            max-width: 550px;
            margin: 60px auto;
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .brand {
            color: #0d6efd;
            font-weight: 700;
        }

        .btn-register {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary"
           href="/">
            ☁ Student Cloud Portal
        </a>

        <a href="/login"
           class="btn btn-outline-primary">
            Login
        </a>

    </div>

</nav>


<div class="container">

    <div class="card register-card">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

                <h2 class="fw-bold">
                    Create Student Account
                </h2>

                <p class="text-muted">
                    Register to access the Student Cloud Portal
                </p>

            </div>


            {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="student@example.com"
                        required>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Course
                        </label>

                        <select
                            name="course"
                            class="form-select"
                            required>

                            <option value="">
                                Select Course
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="BE Computer Engineering">
                                BE Computer Engineering
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Year
                        </label>

                        <select
                            name="year"
                            class="form-select"
                            required>

                            <option value="">
                                Select Year
                            </option>

                            <option value="1st Year">
                                1st Year
                            </option>

                            <option value="2nd Year">
                                2nd Year
                            </option>

                            <option value="3rd Year">
                                3rd Year
                            </option>

                            <option value="Final Year">
                                Final Year
                            </option>

                        </select>

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Minimum 6 characters"
                        required>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Confirm your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary btn-register w-100">

                    Create Student Account

                </button>

            </form>


            <div class="text-center mt-4">

                <span class="text-muted">
                    Already have an account?
                </span>

                <a href="/login"
                   class="text-decoration-none fw-semibold">

                    Login here

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
