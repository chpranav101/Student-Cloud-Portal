<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Student Cloud Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .login-container {
            max-width: 450px;
            margin: 80px auto;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .navbar {
            background: #0f172a;
        }

        .navbar-brand {
            color: white !important;
        }

        .btn-primary {
            background: #2563eb;
            border: none;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            ☁ Student Cloud Portal
        </a>
    </div>
</nav>

<div class="container login-container">

    <div class="login-card">

        <div class="text-center mb-4">
            <div style="font-size:50px;">🔐</div>

            <h2 class="fw-bold">
                Login
            </h2>

            <p class="text-muted">
                Admin and Student Login
            </p>
        </div>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >
            </div>

            <button class="btn btn-primary w-100 py-2">
                Login
            </button>

        </form>

        <div class="text-center mt-4">
            <p class="text-muted">
                New student?
                <a href="/register">Create an account</a>
            </p>
        </div>

        <div class="alert alert-light mt-3 small">
            <strong>Admin Demo Login</strong><br>
            Email: admin@studentcloud.com<br>
            Password: admin123
        </div>

    </div>

</div>

</body>
</html>
