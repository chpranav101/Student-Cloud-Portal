<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
        }

        .form-card {
            max-width: 650px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .navbar {
            background: #0f172a;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/admin">
            ☁ Student Cloud Portal
        </a>

        <div>
            <a href="/admin" class="nav-link d-inline-block">
                Dashboard
            </a>

            <a href="/students" class="nav-link d-inline-block">
                Students
            </a>

            <a href="/admin/documents" class="nav-link d-inline-block">
                Documents
            </a>

            <a href="/logout" class="nav-link d-inline-block">
                Logout
            </a>
        </div>

    </div>
</nav>

<div class="container">

    <div class="form-card">

        <h2 class="fw-bold mb-4">
            Add Student
        </h2>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Student Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Course
                </label>

                <input
                    type="text"
                    name="course"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Year
                </label>

                <input
                    type="text"
                    name="year"
                    class="form-control"
                    required
                >

            </div>

            <button class="btn btn-primary">
                Add Student
            </button>

            <a href="/students"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
